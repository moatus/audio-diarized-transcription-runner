[project]
name = "audio_diarized_transcription_runner"
version = "0.1.0"
description = "Livepeer audio diarized transcription runner backed by NVIDIA NeMo."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115.0,<0.117.0",
    "uvicorn[standard]>=0.30.0,<0.33.0",
    "python-multipart>=0.0.12,<0.1.0",
    "omegaconf>=2.3.0,<3.0.0",
    "pytorch-lightning==2.4.0",
    "nemo_toolkit[asr]==2.0.0",
]

[project.scripts]
audio-diarized-transcription-runner = "audio_diarized_transcription_runner.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audio_diarized_transcription_runner"]


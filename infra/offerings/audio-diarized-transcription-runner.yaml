capability: openai:audio-transcriptions
description: |
  Audio diarized transcription runner. Accepts multipart audio upload,
  normalizes the input to 16 kHz mono WAV, runs NVIDIA NeMo diarization-with-ASR
  for bounded requests, and returns text, timestamps, optional speaker labels,
  subtitle artifacts, and usage. Also exposes an OpenAI-compatible bounded
  transcription route and an adjacent true-streaming WebSocket route.

offerings:
  - name: openai-audio-transcriptions
    description: Transcribe uploaded audio and label speaker turns
    methods:
      - POST /v1/audio/transcriptions
      - WS /v1/audio/transcriptions/stream
      - GET /openai:audio-transcriptions/options
    input: audio
    rate_card_hints:
      unit: audio_seconds

models:
  - id: nemo-diarized-transcription-meeting-v0
    family: NVIDIA NeMo
    notes: Meeting preset using VAD, speaker embeddings, clustering, and English ASR.
  - id: vad_multilingual_marblenet
    family: NVIDIA NeMo VAD
    notes: Default voice activity detector.
  - id: titanet_large
    family: NVIDIA NeMo speaker embeddings
    notes: Default speaker embedding model.
  - id: stt_en_conformer_ctc_large
    family: NVIDIA NeMo ASR
    notes: Default English ASR model for direct requests.
  - id: nvidia/parakeet-tdt-0.6b-v3
    family: NVIDIA NeMo ASR
    notes: Default English ASR model for live-session final transcription.
  - id: nvidia/nemotron-speech-streaming-en-0.6b
    family: NVIDIA NeMo streaming ASR
    notes: Default true streaming ASR model for the WebSocket PoC.
  - id: nvidia/parakeet_realtime_eou_120m-v1
    family: NVIDIA NeMo streaming ASR
    notes: Optional Parakeet realtime EOU ASR candidate for the WebSocket PoC.
  - id: nvidia/diar_streaming_sortformer_4spk-v2.1
    family: NVIDIA NeMo streaming diarization
    notes: Default true streaming Sortformer diarization model for the WebSocket PoC.

# Run-only compose for audio-diarized-transcription-runner. Build via
# `./build-images.sh build audio-diarized-transcription-runner`.
#
# NeMo, Hugging Face, and torch model caches resolve from the models volume.

services:
  audio_diarized_transcription_runner:
    image: ${REGISTRY:-moatus}/audio-diarized-transcription-runner:${TAG:-v0.1.0}
    runtime: nvidia
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    environment:
      - RUNNER_PORT=8080
      - DEVICE=${NEMO_DEVICE:-cuda}
      - CAPABILITY_NAME=openai:audio-transcriptions
      - METRICS_ENABLED=${NEMO_METRICS_ENABLED:-false}
      - MAX_QUEUE_SIZE=${NEMO_MAX_QUEUE_SIZE:-1}
      - MAX_AUDIO_MB=${NEMO_MAX_AUDIO_MB:-100}
      - MODEL_CACHE_DIR=/models
      - WORK_DIR=/tmp/audio-diarized-transcription-runner
      - DEFAULT_VAD_MODEL=${DEFAULT_VAD_MODEL:-vad_multilingual_marblenet}
      - DEFAULT_SPEAKER_MODEL=${DEFAULT_SPEAKER_MODEL:-titanet_large}
      - DEFAULT_ASR_MODEL=${DEFAULT_ASR_MODEL:-stt_en_conformer_ctc_large}
      - LIVE_PROVISIONAL_ASR_MODEL=${LIVE_PROVISIONAL_ASR_MODEL:-stt_en_conformer_ctc_large}
      - LIVE_FINAL_ASR_MODEL=${LIVE_FINAL_ASR_MODEL:-nvidia/parakeet-tdt-0.6b-v3}
      - LIVE_FINAL_ASR_BATCH_SIZE=${LIVE_FINAL_ASR_BATCH_SIZE:-4}
      - LIVE_FINAL_ASR_DECODING_STRATEGY=${LIVE_FINAL_ASR_DECODING_STRATEGY:-}
      - LIVE_FINAL_ASR_BEAM_SIZE=${LIVE_FINAL_ASR_BEAM_SIZE:-}
      - DEFAULT_MAX_SPEAKERS=${DEFAULT_MAX_SPEAKERS:-8}
      - DEFAULT_PRESET=${DEFAULT_PRESET:-meeting}
      - LIVE_HISTORY_BUFFER_SIZE=${LIVE_HISTORY_BUFFER_SIZE:-256}
      - LIVE_CURRENT_BUFFER_SIZE=${LIVE_CURRENT_BUFFER_SIZE:-256}
      - LIVE_SESSION_TTL_SECONDS=${LIVE_SESSION_TTL_SECONDS:-3600}
      - LIVE_CLOSED_SESSION_TTL_SECONDS=${LIVE_CLOSED_SESSION_TTL_SECONDS:-300}
      - TRUE_STREAMING_ENABLED=${TRUE_STREAMING_ENABLED:-true}
      - TRUE_STREAMING_ENGINE=${TRUE_STREAMING_ENGINE:-nemo}
      - TRUE_STREAMING_ASR_MODEL=${TRUE_STREAMING_ASR_MODEL:-nvidia/nemotron-speech-streaming-en-0.6b}
      - TRUE_STREAMING_DIAR_MODEL=${TRUE_STREAMING_DIAR_MODEL:-nvidia/diar_streaming_sortformer_4spk-v2.1}
      - TRUE_STREAMING_SAMPLE_RATE=${TRUE_STREAMING_SAMPLE_RATE:-16000}
      - TRUE_STREAMING_ASR_ATT_CONTEXT_SIZE=${TRUE_STREAMING_ASR_ATT_CONTEXT_SIZE:-70,1}
      - TRUE_STREAMING_ASR_CHUNK_SECONDS=${TRUE_STREAMING_ASR_CHUNK_SECONDS:-0.08}
      - TRUE_STREAMING_ASR_GREEDY_MAX_SYMBOLS=${TRUE_STREAMING_ASR_GREEDY_MAX_SYMBOLS:-16}
      - TRUE_STREAMING_ASR_EOU_TOKENS=${TRUE_STREAMING_ASR_EOU_TOKENS:-<EOU>,<EOB>}
      - TRUE_STREAMING_ASR_STABILIZE_PARTIALS=${TRUE_STREAMING_ASR_STABILIZE_PARTIALS:-true}
      - TRUE_STREAMING_ASR_EMIT_MIN_WORDS=${TRUE_STREAMING_ASR_EMIT_MIN_WORDS:-6}
      - TRUE_STREAMING_ASR_EMIT_MIN_CHARS=${TRUE_STREAMING_ASR_EMIT_MIN_CHARS:-28}
      - TRUE_STREAMING_ASR_EMIT_MAX_HOLD_SECONDS=${TRUE_STREAMING_ASR_EMIT_MAX_HOLD_SECONDS:-1.2}
      - TRUE_STREAMING_DIAR_FRAME_SECONDS=${TRUE_STREAMING_DIAR_FRAME_SECONDS:-0.08}
      - TRUE_STREAMING_DIAR_THRESHOLD=${TRUE_STREAMING_DIAR_THRESHOLD:-0.4}
      - TRUE_STREAMING_MAX_SESSION_SECONDS=${TRUE_STREAMING_MAX_SESSION_SECONDS:-3600}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - audio-diarized-transcription-models:/models
      - audio-diarized-transcription-nemo-cache:/root/.cache/torch/NeMo
      - audio-diarized-transcription-work:/tmp/audio-diarized-transcription-runner
    ports:
      - "${AUDIO_DIARIZED_TRANSCRIPTION_RUNNER_PORT:-8080}:8080"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  audio-diarized-transcription-models: {}
  audio-diarized-transcription-nemo-cache: {}
  audio-diarized-transcription-work: {}
